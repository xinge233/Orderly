<!doctype html>
<html lang="zh-CN" data-motion="gentle">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="Canvas" id="theme-color-meta">
    <link rel="icon" href="data:,">
    <title>归序 Orderly · 可控本地工作流</title>
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="app-shell" data-motion-scope="app-shell" data-motion-state="ready" data-motion-phase="active">
        <aside class="sidebar" id="sidebar" aria-label="应用导航" data-motion-scope="sidebar" data-motion-state="collapsed" data-motion-phase="active">
            <header class="brand">
                <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="brand-copy">
                    <strong>归序</strong>
                    <small>ORDERLY</small>
                </span>
            </header>

            <label class="search-box">
                <span class="search-box__icon" data-icon="search" aria-hidden="true"></span>
                <span class="sr-only">搜索功能</span>
                <input id="nav-search" type="search" placeholder="搜索功能" autocomplete="off" aria-label="搜索功能">
                <kbd>/</kbd>
            </label>

            <div class="sidebar-scroll">
                <nav class="nav-groups" id="primary-nav" aria-label="主要功能"></nav>
                <p class="sr-only" id="navigation-order-status" aria-live="polite"></p>
            </div>

            <footer class="sidebar-footer">
                <div class="sandbox-status" role="status" aria-live="polite" aria-label="正在连接本地服务，等待工作区状态">
                    <span class="workspace-icon" data-icon="folder" aria-hidden="true"></span>
                    <span class="workspace-path" id="workspace-path">.orderly-data/workspace</span>
                </div>
                <button class="settings-trigger" id="open-settings" type="button" aria-label="打开设置：外观、动效与系统">
                    <span data-icon="settings" aria-hidden="true"></span>
                    <span><strong>设置</strong></span>
                    <kbd>Ctrl ,</kbd>
                </button>
            </footer>
        </aside>

        <div class="app-main">
            <header class="mobile-toolbar">
                <button
                    class="icon-button mobile-menu"
                    id="mobile-menu"
                    type="button"
                    aria-label="打开导航"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >
                    <span data-icon="menu" aria-hidden="true"></span>
                </button>
                <strong id="mobile-view-title">总览</strong>
            </header>

            <nav class="history-view-rail" id="history-view-rail" aria-label="历史记录视图" hidden>
                <button type="button" data-history-view="timeline" aria-pressed="true">时间线</button>
                <button type="button" data-history-view="summary" aria-pressed="false">运行摘要</button>
            </nav>

            <main class="main-content" id="main-content" tabindex="-1" data-motion-scope="main" data-motion-state="loading" data-motion-phase="active">
                <section class="loading-panel" aria-live="polite">
                    <span class="loading-orbit" aria-hidden="true"></span>
                    <h1>正在准备本地工作台</h1>
                    <p>读取沙箱状态与模块契约…</p>
                </section>
            </main>
        </div>
    </div>

    <div class="sidebar-count-layer" id="sidebar-count-layer" aria-hidden="true"></div>

    <span class="ai-snap-target" id="ai-snap-target" aria-hidden="true"></span>

    <section
        class="ai-dock"
        id="ai-dock"
        aria-label="AI 对话框"
        data-motion-scope="ai-dialog"
        data-motion-state="collapsed"
        data-motion-phase="active"
        data-mode="collapsed"
        data-anchor="default"
        data-composer="closed"
        data-panel="closed"
        data-popover="closed"
        data-dragging="false"
        data-demo="true"
    >
        <button
            class="ai-launcher"
            id="ai-launcher"
            type="button"
            aria-label="打开 AI 对话；可拖动调整位置"
            title="单击打开 AI 对话，拖动调整位置"
        >
            <span class="ai-launcher__ring" aria-hidden="true"></span>
            <span class="ai-launcher__icon" id="ai-launcher-icon" data-icon="spark" aria-hidden="true"></span>
            <span class="ai-launcher__status" aria-hidden="true"></span>
        </button>

        <section class="ai-composer" id="ai-composer" aria-label="AI 输入框" aria-hidden="true">
            <form class="ai-composer__form" id="ai-composer-form">
                <label class="sr-only" for="ai-composer-input">输入 AI 指令</label>
                <textarea
                    id="ai-composer-input"
                    rows="1"
                    maxlength="600"
                    placeholder="告诉 AI 你想整理什么；当前仅演示界面，不会执行操作"
                ></textarea>
                <span class="ai-demo-badge">
                    <span class="ai-demo-badge__full">界面演示 · 未接入 AI</span>
                    <span class="ai-demo-badge__compact">未接入 AI</span>
                </span>
                <button class="ai-icon-button" id="ai-composer-close" type="button" aria-label="收起 AI 输入框">
                    <span data-icon="close" aria-hidden="true"></span>
                </button>
                <button class="ai-send-button" id="ai-send-button" type="submit">
                    <span class="ai-send-button__icon" id="ai-send-icon" aria-hidden="true"></span>
                    <span>生成</span>
                </button>
            </form>
        </section>

        <section class="ai-plan-panel" id="ai-plan-panel" aria-label="AI 计划栏" aria-hidden="true">
            <header class="ai-plan-panel__head">
                <div>
                    <span class="ai-plan-panel__eyebrow">界面演示 · 未接入 AI</span>
                    <h2 id="ai-plan-title">尚未生成计划</h2>
                </div>
                <button class="ai-icon-button" id="ai-plan-close" type="button" aria-label="关闭计划">
                    <span data-icon="close" aria-hidden="true"></span>
                </button>
            </header>
            <ol class="ai-plan-list" id="ai-plan-list" aria-live="polite"></ol>
            <footer class="ai-plan-actions">
                <span class="ai-risk-indicator" id="ai-risk-indicator" data-risk="READ_ONLY">
                    <span data-icon="shield" aria-hidden="true"></span>
                    <span>风险等级：只读</span>
                </span>
                <button class="ai-run-button" id="ai-run-button" type="button">
                    <span data-icon="check-plain" aria-hidden="true"></span>
                    <span>执行</span>
                </button>
            </footer>
        </section>

        <aside
            class="ai-progress-popover"
            id="ai-progress-popover"
            aria-label="AI 运行进度"
            aria-hidden="true"
        >
            <header>
                <strong id="ai-progress-title">界面演示 · 未接入 AI</strong>
                <span>执行进度</span>
            </header>
            <ol id="ai-progress-list" aria-live="polite"></ol>
            <p>当前仅展示状态变化，不会调用模块或修改文件。</p>
        </aside>
    </section>

    <div class="ai-call-layer" id="ai-call-layer" aria-hidden="true"></div>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title" data-motion-scope="settings-dialog" data-motion-state="closed" data-motion-phase="idle">
        <div class="settings-frame">
            <header class="settings-head">
                <div>
                    <p class="eyebrow">ORDERLY PREFERENCES</p>
                    <h2 id="settings-title">设置</h2>
                </div>
                <button class="icon-button" id="close-settings" type="button" aria-label="关闭设置">
                    <span data-icon="close" aria-hidden="true"></span>
                </button>
            </header>
            <div class="settings-body">
                <nav class="settings-nav" id="settings-nav" aria-label="设置分类"></nav>
                <section class="settings-panel" id="settings-panel"></section>
            </div>
            <footer class="settings-footer">
                <span id="settings-status" role="status" aria-live="polite">外观偏好保存在当前浏览器；模块治理偏好由本地宿主保存。</span>
                <button class="text-button" id="reset-settings" type="button">恢复外观默认</button>
            </footer>
        </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" data-motion-scope="feedback" data-motion-state="idle" data-motion-phase="idle"></div>
    <div class="scrim" id="mobile-scrim" hidden></div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
