<!doctype html>
<html lang="zh-CN" data-motion="gentle">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="Canvas" id="theme-color-meta">
    <link rel="icon" href="data:,">
    <title>归序 Orderly · 可控本地工作流</title>
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="app-shell" data-motion-scope="app-shell" data-motion-state="ready" data-motion-phase="active">
        <aside class="sidebar" id="sidebar" aria-label="应用导航" data-motion-scope="sidebar" data-motion-state="collapsed" data-motion-phase="active">
            <header class="brand">
                <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="brand-copy">
                    <strong>归序</strong>
                    <small>ORDERLY</small>
                </span>
            </header>

            <label class="search-box">
                <span class="search-box__icon" data-icon="search" aria-hidden="true"></span>
                <span class="sr-only">搜索功能</span>
                <input id="nav-search" type="search" placeholder="搜索功能" autocomplete="off" aria-label="搜索功能">
                <kbd>/</kbd>
            </label>

            <div class="sidebar-scroll">
                <nav class="nav-groups" id="primary-nav" aria-label="主要功能"></nav>
                <p class="sr-only" id="navigation-order-status" aria-live="polite"></p>
            </div>

            <footer class="sidebar-footer">
                <div class="sandbox-status" role="status" aria-live="polite" aria-label="正在连接本地服务，等待工作区状态">
                    <span class="workspace-icon" data-icon="folder" aria-hidden="true"></span>
                    <span class="workspace-path" id="workspace-path">.orderly-data/workspace</span>
                </div>
                <button class="settings-trigger" id="open-settings" type="button" aria-label="打开设置：外观、动效与系统">
                    <span data-icon="settings" aria-hidden="true"></span>
                    <span><strong>设置</strong></span>
                    <kbd>Ctrl ,</kbd>
                </button>
            </footer>
        </aside>

        <div class="app-main">
            <header class="mobile-toolbar">
                <button
                    class="icon-button mobile-menu"
                    id="mobile-menu"
                    type="button"
                    aria-label="打开导航"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >
                    <span data-icon="menu" aria-hidden="true"></span>
                </button>
                <strong id="mobile-view-title">总览</strong>
            </header>

            <main class="main-content" id="main-content" tabindex="-1" data-motion-scope="main" data-motion-state="loading" data-motion-phase="active">
                <section class="loading-panel" aria-live="polite">
                    <span class="loading-orbit" aria-hidden="true"></span>
                    <h1>正在准备本地工作台</h1>
                    <p>读取沙箱状态与模块契约…</p>
                </section>
            </main>
        </div>
    </div>

    <div class="sidebar-count-layer" id="sidebar-count-layer" aria-hidden="true"></div>

    <aside class="command-dock" id="command-dock" aria-label="计划指令入口" data-motion-scope="command-panel" data-motion-state="collapsed" data-motion-phase="active">
        <div class="command-dock__glow" aria-hidden="true"></div>
        <div class="command-intro">
            <span class="command-spark" data-icon="spark" aria-hidden="true"></span>
            <span>
                <strong>告诉归序你想完成什么</strong>
                <small class="planner-disclosure" id="planner-badge">本地规则计划器 · 未连接外部模型</small>
            </span>
            <button class="dock-toggle" id="dock-toggle" type="button" aria-expanded="false">
                展开
            </button>
        </div>
        <div class="command-examples" id="command-examples" aria-label="示例指令"></div>
        <form class="command-form" id="command-form">
            <label class="sr-only" for="command-input">输入工作流目标</label>
            <textarea
                id="command-input"
                rows="1"
                maxlength="600"
                placeholder="请输入已安装模块提供的示例指令"
            ></textarea>
            <button class="send-button" id="send-command" type="submit">
                <span data-icon="arrow-up" aria-hidden="true"></span>
                <span>生成计划</span>
            </button>
        </form>
        <p class="dock-footnote" id="command-note">未连接外部模型；当前使用可审计的本地规则计划器。</p>
    </aside>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title" data-motion-scope="settings-dialog" data-motion-state="closed" data-motion-phase="idle">
        <div class="settings-frame">
            <header class="settings-head">
                <div>
                    <p class="eyebrow">ORDERLY PREFERENCES</p>
                    <h2 id="settings-title">设置</h2>
                </div>
                <button class="icon-button" id="close-settings" type="button" aria-label="关闭设置">
                    <span data-icon="close" aria-hidden="true"></span>
                </button>
            </header>
            <div class="settings-body">
                <nav class="settings-nav" id="settings-nav" aria-label="设置分类"></nav>
                <section class="settings-panel" id="settings-panel"></section>
            </div>
            <footer class="settings-footer">
                <span id="settings-status" role="status" aria-live="polite">外观偏好保存在当前浏览器；模块治理偏好由本地宿主保存。</span>
                <button class="text-button" id="reset-settings" type="button">恢复外观默认</button>
            </footer>
        </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" data-motion-scope="feedback" data-motion-state="idle" data-motion-phase="idle"></div>
    <div class="scrim" id="mobile-scrim" hidden></div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
