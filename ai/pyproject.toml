[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orderly-ai"
version = "0.1.0"
description = "Local-only AI planning service for Orderly"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema[format]>=4.23,<5.0",
    "pytest>=8.3,<10.0",
]
packaging = [
    "pyinstaller>=6.22,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
