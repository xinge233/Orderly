name: Publish runtime and source release

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.releaseTag || github.ref_name }}

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate release source
        shell: pwsh
        run: ./scripts/gate.ps1 -MaxParallel 2

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build.ps1 -MaxParallel 2

      - name: Package and verify prebuilt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/package-runtime.ps1
          $runtimeZip = Get-ChildItem ./target/orderly-runtime -File -Filter "*-runtime.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $runtimeZip) { throw "未生成预构建运行包" }
          ./scripts/verify-runtime.ps1 -PackagePath $runtimeZip.FullName

      - name: Package and verify offline source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/package-offline.ps1
          $sourceZip = Get-ChildItem ./target/orderly-offline -File -Filter "*-offline-source.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $sourceZip) { throw "未生成离线源码包" }
          ./scripts/verify-offline.ps1 $sourceZip.FullName -MaxParallel 2
          ./scripts/verify-release-pair.ps1 `
            -RuntimePackage $runtimeZip.FullName `
            -SourcePackage $sourceZip.FullName

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeZip = Get-ChildItem ./target/orderly-runtime -File -Filter "*-runtime.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $sourceZip = Get-ChildItem ./target/orderly-offline -File -Filter "*-offline-source.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $runtimeZip -or -not $sourceZip) {
            throw "发布资产不完整"
          }
          $assets = @(
            $runtimeZip.FullName,
            "$($runtimeZip.FullName).sha256",
            $sourceZip.FullName,
            "$($sourceZip.FullName).sha256"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "缺少发布资产：$asset"
            }
          }
          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            & gh release create $env:RELEASE_TAG @assets --generate-notes --title $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 上传失败"
          }
